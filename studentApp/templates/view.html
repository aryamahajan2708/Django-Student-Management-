{% extends 'base.html' %}

{% block title %}View | DjangoApp{% endblock %}

{% block content %}
        <table class="table">
            <tr>
                <th>First Name </th>               
                <th>Last Name </th>
                <th>Course </th>
                <th>Age </th>
                <th>Mobile </th>
                <th>Email </th>        
            </tr>
            {% for p in persons %}
                <tr>
                    <td>{{p.first_name}}</td>
                    <td>{{p.last_name}}</td>
                    <td>{{p.course}}</td>
                    <td>{{p.age}}</td>
                    <td>{{p.mobile}}</td>
                    <td>{{p.email}}</td>
                    <td>
                        <a href="{% url 'delete_person' p.id %}" 
                            onclick="return confirm('Are you sure you want to delete this person?');" 
                            style="background-color: red; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold;">
                            Delete
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </table>
        <a href="{% url 'dashboard' %}"><button class="bg-primary p-3 text-light" type="button">Go-Back</button></a>
{% endblock %}
